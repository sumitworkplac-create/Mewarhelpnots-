<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MewarHelpNots — Ask Anyone Question</title>
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body>
  <!-- Auth Screen -->
  <section id="auth-screen" class="overlay" style="background: var(--bg);">
    <div class="modal" style="text-align: center;">
      <img src="./icon.png" alt="MewarHelpNots" style="width: 110px; margin: 0 auto 1rem; display: block;" />
      <h1 style="font-size: 1.5rem; color: var(--primary);">MewarHelpNots</h1>
      <p style="color: var(--muted); font-size: 0.9rem; margin: 0.4rem 0 1.4rem;">Ask Anyone Question • Mewar University Study Hub</p>
      <button id="google-login-btn" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
        <i class="fab fa-google"></i> Continue with Google
      </button>
      <p id="auth-error" class="hidden" style="color: var(--danger); font-size: 0.82rem; margin-top: 0.75rem;"></p>
    </div>
  </section>

  <!-- Main App -->
  <div id="app" class="hidden">
    <nav class="navbar">
      <div class="nav-inner">
        <div class="brand" onclick="window.appNav('home')">
          <img src="./icon.png" alt="Logo" />
          <div class="brand-text">
            <div class="brand-title">mewarhelpnots</div>
            <div class="brand-sub">Ask Anyone Question</div>
          </div>
        </div>
        <div class="nav-links">
          <button id="btn-nav-home" class="nav-btn active" onclick="window.appNav('home')"><i class="fas fa-comments"></i><span class="nav-label">Q&amp;A</span></button>
          <button id="btn-nav-notes" class="nav-btn" onclick="window.appNav('notes')"><i class="fas fa-book"></i><span class="nav-label">Materials</span></button>
          <button id="btn-nav-profile" class="nav-btn" onclick="window.appNav('profile')"><i class="fas fa-user"></i><span class="nav-label">Profile</span></button>
          <button id="btn-nav-admin" class="nav-btn hidden" onclick="window.appNav('admin')"><i class="fas fa-shield-halved"></i><span class="nav-label">Admin</span></button>
          <div id="admin-role-switch" class="role-switch hidden">
            <button id="chip-admin" class="role-chip active" onclick="window.setPreviewRole('admin')">Admin</button>
            <button id="chip-faculty" class="role-chip" onclick="window.setPreviewRole('faculty')">Faculty</button>
            <button id="chip-student" class="role-chip" onclick="window.setPreviewRole('student')">Student</button>
          </div>
          <button id="logout-btn" class="nav-btn" style="color: var(--danger);"><i class="fas fa-right-from-bracket"></i></button>
        </div>
      </div>
    </nav>

    <main id="main-content" class="container"></main>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="overlay hidden">
    <div class="modal">
      <h2 style="margin-bottom: 0.25rem;">Setup Your Profile</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem;">Set your display name and campus role.</p>
      <form id="profile-form" style="display: grid; gap: 0.85rem;">
        <input id="p-name" class="input" required placeholder="Full Name" maxlength="80" />
        <select id="p-role" class="select">
          <option value="student">Student</option>
          <option value="faculty">Faculty Member</option>
          <option value="admin">Admin</option>
        </select>
        <input id="p-passcode" type="password" class="input hidden" placeholder="Enter role security passcode" />
        <div style="display: flex; gap: 0.5rem;">
          <button type="button" id="p-cancel" class="btn btn-secondary" style="flex:1;">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex:1;">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- File Viewer Modal -->
  <div id="viewer-modal" class="overlay hidden">
    <div class="modal pdf-modal">
      <div style="padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
        <strong id="viewer-title" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Document</strong>
        <div style="display: flex; gap: 0.5rem;">
          <a id="viewer-download" href="#" target="_blank" download class="btn btn-primary btn-sm"><i class="fas fa-download"></i> Download</a>
          <button id="viewer-close" class="btn btn-secondary btn-sm"><i class="fas fa-xmark"></i></button>
        </div>
      </div>
      <iframe id="viewer-frame" style="flex: 1; border: none; width: 100%; background: #e5e7eb;"></iframe>
    </div>
  </div>

  <div id="toast-box"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
